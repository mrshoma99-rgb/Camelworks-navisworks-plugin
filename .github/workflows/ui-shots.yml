# Pictures of the panes, taken by the machine that compiled them.
#
# CamelWorks.UI is a Navisworks dock pane, so the normal way to look at a layout change is to
# install a plug-in into a licensed CAD application and click through to it. That loop is slow
# enough that layouts stop being iterated, and it is unavailable entirely to anyone reviewing a
# change who does not have Navisworks.
#
# It does not have to be either. The pane is ordinary WPF, so CamelWorks.Studio renders a screen
# into a PNG with no Autodesk assembly anywhere near it. This job runs that, uploads the images as
# an artifact, and force-pushes them to a branch called ui-shots so they can be fetched and looked
# at without downloading a zip.
#
# The screens it draws are named when the run is started, and it draws them in the light palette
# only. Every page in both themes was thirty pictures a run - and a run happens because somebody
# wants to look at one screen, so twenty-eight of them were Windows minutes spent at twice the
# rate on images nobody opened. Name what you want to see, or pass `all`.
#
# On demand, not on every push. It is a Windows runner - billed at twice the rate - and what it
# produces is something somebody looks at when they want to look at it, which is a fraction of the
# pushes that touch the UI. Run it from the Actions tab, or with `gh workflow run ui-shots.yml`,
# when the pictures are the thing being asked for. Every push still compiles the UI; this is the
# part that only earns its minutes when somebody is going to open the images.
#
# The branch is deliberately orphaned and rewritten each time: it is a viewing surface, not
# history, and binary images accumulating on a source branch is how a repository gets heavy.

name: ui-shots

on:
  # On demand only. A Windows runner bills at twice the rate, and the pictures are something
  # somebody asks for, not something every push owes them - run it from the Actions tab or with
  # `gh workflow run ui-shots.yml` when the pictures are the thing being asked for.
  workflow_dispatch:
    inputs:
      pages:
        description: "Which pages to draw, by id, comma-separated - or 'all'"
        required: false
        default: "app-clash-manage,app-clash-finder,app-clash-matrix,app-clash-matrix-drawn,app-clash-matrix-fields,app-clash-matrix-read,app-clash-matrix-scrolled,app-clash-matrix-line,app-clash-exchange,app-clash-exchange-import,app-clash-rules,app-clash-report,app-clash-levels,app-clash-naming-tests,app-clash-naming-patterns,app-clash-naming-write,app-clash-matrix-results,app-clash-matrix-priority"

  # A push to render/** is a request for a picture, and the only way an agent working in this
  # repository can ask for one: dispatching a workflow needs actions:write, which the app it runs
  # under does not have, so `gh workflow run` comes back 403 every time. Without this, every
  # layout change had to be described in words to somebody with a browser and the answer waited on
  # them coming back - which is how a clipped heading survived three rounds of fixes aimed at it.
  #
  # It is still on demand. Nothing fires on main, on a feature branch, or on any ordinary push:
  # render/** is a branch that exists to be pushed to when a picture is the thing being asked for,
  # and one push is one run.
  push:
    branches:
      - "render/**"

# One at a time per branch, and the newer one wins. This job force-pushes an orphan branch, so two
# runs in flight together are two writers racing over the same ref - and the pictures that survive
# would be whichever finished last rather than whichever is current.
concurrency:
  group: ui-shots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  shots:
    name: Windows (render the panes)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build the harness
        run: dotnet build CamelWorks.Studio/CamelWorks.Studio.csproj -c Release

      # A WinExe writes nothing to the console it was started from, so the harness keeps its own
      # log beside the images and this prints it. Without that, a sheet that failed to render is
      # simply a file that is not there - and the log is also where a mistyped page id is named,
      # which otherwise looks exactly like a clean run that drew nothing.
      #
      # The named pages only, in the light palette. Every page in both themes was thirty pictures
      # a run, and a run happens because somebody wants to look at one screen: the other
      # twenty-eight cost Windows minutes at twice the rate to be force-pushed and never opened.
      # Pass `all` to draw the lot when that is genuinely what is wanted.
      - name: Render the named panes
        run: |
          dotnet run --project CamelWorks.Studio/CamelWorks.Studio.csproj -c Release --no-build -- --shoot "${{ github.workspace }}\shots" --only "${{ inputs.pages }}"
          Get-Content "${{ github.workspace }}\shots\_log.txt"

      - name: Upload the images
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: shots/*
          if-no-files-found: error

      - name: Publish them to the ui-shots branch
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/') || startsWith(github.ref, 'refs/heads/render/')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # An orphan branch, emptied and refilled. git rm clears everything that is tracked;
          # shots/ was written by the run and is untracked, so it survives that and is all that
          # gets committed.
          git checkout --orphan ui-shots
          git rm -rf --quiet . > /dev/null
          git add --force shots
          git commit --quiet -m "Panes as rendered from ${GITHUB_SHA:0:7} on ${GITHUB_REF_NAME}"
          git push --force origin ui-shots
